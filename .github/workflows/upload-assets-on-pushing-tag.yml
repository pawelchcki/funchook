on:
  push:
    tags:
    - 'v*'

name: Upload Assets

permissions:
  contents: write

jobs:
  build:
    name: Upload Assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Make Assets
        id: assets
        run: |
          set -eux
          PROJECT_VERSION=$(perl -ne 'print $1 if /project\(.*VERSION\s+([0-9]+(?:\.[0-9]+){2})/' CMakeLists.txt)
          test -n "$PROJECT_VERSION"
          DIR_NAME="funchook-$PROJECT_VERSION"
          TGZ_FILE_NAME="$DIR_NAME.tar.gz"
          ZIP_FILE_NAME="$DIR_NAME.zip"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" --recursive . "$DIR_NAME"
          rm -rf "$DIR_NAME/.ci" "$DIR_NAME/.dockerignore" "$DIR_NAME/.git"
          tar -czf "$TGZ_FILE_NAME" "$DIR_NAME"
          zip -rq "$ZIP_FILE_NAME" "$DIR_NAME"
          echo "tgz_file_name=$TGZ_FILE_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_file_name=$ZIP_FILE_NAME" >> "$GITHUB_OUTPUT"
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.assets.outputs.tgz_file_name }}" \
            "${{ steps.assets.outputs.zip_file_name }}" \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes
