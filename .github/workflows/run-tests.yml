name: Tests
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust_lints:
    name: Rust formatting and Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - run: cargo fmt --all -- --check
    - run: cargo clippy --all-targets --locked -- -D warnings

  rust_tests:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          cargo_features: ""
        - os: macos-latest
          cargo_features: --features libc
        - os: windows-latest
          cargo_features: --features libc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - run: cargo test --all-targets --locked ${{ matrix.cargo_features }}
    - name: Verify static native linkage
      if: matrix.os == 'ubuntu-latest'
      shell: bash
      run: |
        test "$(cargo tree --locked --edges normal --depth 1 | wc -l)" -eq 1
        native_test=$(find target/debug/deps -type f -executable -name 'native-*' | head -1)
        ! ldd "$native_test" | grep -Eiq 'funchook|capstone'

  rust_package_offline:
    name: Packaged crate (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - run: cargo fetch --locked
    - run: cargo package --locked
    - name: Build packaged archive offline
      shell: bash
      run: |
        mkdir package-test
        tar -xzf target/package/funchook-*.crate -C package-test
        cargo build --manifest-path package-test/funchook-*/Cargo.toml --offline --locked

  tests_on_alpine:
    name: Tests on Alpine (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: x86_64 tests on Alpine
      run: |
        docker build -f .ci/Dockerfile-alpine-test -t funchook-test .
        docker run --rm funchook-test

  build_on_macos:
    name: Build on macOS (arm64)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: arm64 build on macOS
      run: |
        cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release -DFUNCHOOK_DISASM=capstone
        cmake --build build-macos --parallel

  tests_on_ubuntu_arm64:
    name: Tests on Ubuntu (aarch64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: aarch64 tests on Ubuntu
      run: ./.ci/run-cmake-test.sh aarch64-linux

  tests_on_ubuntu_x86_64:
    name: Tests on Ubuntu (x86_64 and i686)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib
    - name: x86_64 tests on Ubuntu
      run: |
        ./.ci/run-cmake-test.sh x86_64-linux
    - name: i686 tests on Ubuntu
      run: |
        ./.ci/run-cmake-test.sh i686-linux     -DCMAKE_C_FLAGS=-m32 -DCMAKE_ASM_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32

  tests_on_windows:
    name: Tests on Windows (x64 and x86)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: x64 tests on Windows
      shell: bash
      run: |
        ./.ci/run-cmake-test.sh x86_64-windows -A x64
    - name: x86 tests on Windows
      shell: bash
      run: |
        ./.ci/run-cmake-test.sh x86-windows -A Win32

  tests_on_wine:
    name: Tests on Wine (x64 and x86)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-i686 wine64 wine-binfmt
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y libgcc-s1:i386 libstdc++6:i386 wine32
        sudo apt-get remove mono-runtime
        echo WINEPATH=$(ls -d /usr/lib/gcc/*-mingw*/*-win32 | tr '\n' ';') >> $GITHUB_ENV
    - name: x64 tests on Wine
      run: |
        ./.ci/run-cmake-test.sh x86_64-mingw32 -DCMAKE_TOOLCHAIN_FILE=../cmake/x86_64-w64-mingw32.cmake
    - name: x86 tests on Wine
      run: |
        ./.ci/run-cmake-test.sh i686-mingw32 -DCMAKE_TOOLCHAIN_FILE=../cmake/i686-w64-mingw32.cmake
